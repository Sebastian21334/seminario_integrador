<section class="hero">
  <div class="hero__inner">
    <h1 class="hero__title">Encontrá tu próximo hogar</h1>
    <p class="hero__subtitle">¿Qué tipo de alquiler estás buscando?</p>

    @if (modalidades().length) {
      <div class="hero__modalidades">
        @for (m of modalidadesOrdenadas(); track m.id; let i = $index) {
          <button
            type="button"
            class="modalidad-btn"
            [class.modalidad-btn--primary]="!esTemporaria(m.nombre)"
            [class.modalidad-btn--secondary]="esTemporaria(m.nombre)"
            [class.modalidad-btn--active]="form().controls['idModalidad'].value === m.id"
            [attr.aria-pressed]="form().controls['idModalidad'].value === m.id"
            (click)="toggleModalidad(m.id)"
          >
            {{ m.nombre }}
          </button>
        }
      </div>
    }

    <form class="hero__search" [formGroup]="form()" (ngSubmit)="onSubmit()">
      <label class="hero__search-label" for="ubicacion"
        ><svg lucideMapPin [size]="28" aria-hidden="true"></svg> Busca en tu zona:</label
      >
      <div class="hero__search-row">
        <input
          id="ubicacion"
          type="text"
          formControlName="ubicacion"
          placeholder="Ingresá la Localidad/Región"
          autocomplete="off"
        />
        <button type="submit" class="btn btn--primary" aria-label="Buscar propiedades">
          <svg lucideSearch [size]="20" aria-hidden="true"></svg>
        </button>
      </div>
    </form>
  </div>
</section>
