<app-hero-search [form]="form" [modalidades]="modalidades()" />
@if (error()) { <p class="home-state home-state--error">{{ error() }}</p> } @else if (cargando()) { <p class="home-state">Cargando publicaciones…</p> } @else { <section class="featured" aria-label="Publicaciones destacadas">@for (seccion of secciones(); track seccion.titulo) { <section class="featured__section"><div class="featured__section-heading"><h2>{{ seccion.titulo }}</h2><a routerLink="/publicaciones" [queryParams]="seccion.categoria ? { categoria: seccion.categoria } : {}">Ver más</a></div><div class="featured__grid">@for (publicacion of seccion.publicaciones; track publicacion.id) { <app-listing-card [publicacion]="publicacion" /> }</div></section> }</section> }
