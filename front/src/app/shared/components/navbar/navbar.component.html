<header class="navbar">
  <div class="navbar__inner">
    <a routerLink="/" class="navbar__logo" aria-label="Ir al inicio">
      <span class="navbar__logo-mark">SI</span>
      <span class="navbar__logo-text">Alquileres</span>
    </a>

    <nav class="navbar__actions">
      @if (auth.isAuthenticated) {
        <a routerLink="/perfil" class="navbar__avatar" title="{{ auth.currentUser()?.email }}">
          {{ (auth.currentUser()?.email ?? '?').charAt(0).toUpperCase() }}
        </a>
      } @else {
        <a routerLink="/login" class="btn btn--ghost">Ingresar</a>
      }
      <a routerLink="/publicaciones/nueva" class="btn btn--primary">Publicar</a>
    </nav>
  </div>
</header>
