<section
  class="advanced"
  [class.advanced--primary]="tieneModalidad() && !esSecundaria()"
  [class.advanced--secondary]="esSecundaria()"
  aria-label="Búsqueda avanzada"
>
  <div class="advanced__intro">
    <svg lucideSearch [size]="30" aria-hidden="true"></svg>
    <strong>Búsqueda avanzada</strong>
    <span>Filtrá por ubicación, tipo de propiedad y precio</span>
  </div>

  <div class="advanced__controls" [formGroup]="form()">
    <label class="advanced__field">
      <svg lucideMapPin [size]="23" aria-hidden="true"></svg>
      <span>
        <small>Ubicación</small>
        <select (change)="seleccionarCiudadUnica($any($event.target).value)">
          <option value="">Todas las ciudades</option>
          @for (ciudad of ciudades(); track ciudad.id) {
            <option [value]="ciudad.id" [selected]="ciudadesSeleccionadasIds.includes(ciudad.id)">{{ etiquetaCiudad(ciudad) }}</option>
          }
        </select>
      </span>
    </label>

    <label class="advanced__field">
      <svg lucideHome [size]="23" aria-hidden="true"></svg>
      <span>
        <small>Tipo de propiedad</small>
        <select (change)="seleccionarTipoPropiedadUnica($any($event.target).value)">
          <option value="">Todas</option>
          @for (tipo of tiposPropiedad(); track tipo.id) {
            <option [value]="tipo.id" [selected]="tipoPropiedadSeleccionado(tipo.id)">{{ tipo.nombre }}</option>
          }
        </select>
      </span>
    </label>

    <label class="advanced__field advanced__field--price">
      <svg lucideCoins [size]="23" aria-hidden="true"></svg>
      <span>
        <small>Precio mensual</small>
        <span class="advanced__price-inputs">
          <input type="number" min="0" placeholder="Desde" [value]="form().controls['precioMin'].value ?? ''" (input)="onPrecioMinInput($any($event.target).value)" />
          <b>—</b>
          <input type="number" min="0" placeholder="Hasta" [value]="form().controls['precioMax'].value ?? ''" (input)="onPrecioMaxInput($any($event.target).value)" />
        </span>
      </span>
    </label>

    <button type="button" class="advanced__submit" (click)="aplicar()">Buscar</button>
  </div>
</section>
