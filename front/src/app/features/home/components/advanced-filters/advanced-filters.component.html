<section
  class="advanced"
  [class.advanced--primary]="categoria() === 'largo-plazo'"
  [class.advanced--secondary]="categoria() === 'temporales'"
  aria-labelledby="advanced-title"
>
  <div class="advanced__intro">
    <span class="advanced__icon"><svg lucideHouse [size]="48" aria-hidden="true"></svg></span>
    <div>
      <h2 id="advanced-title">Búsqueda avanzada</h2>
      <p>Filtrá por ubicación, tipo de propiedad, precio y características</p>
    </div>
  </div>

  <div class="advanced__controls" [formGroup]="form()">
    <app-selector-ubicacion
      class="advanced__location"
      idPrefix="filtro-ubicacion"
      [advanced]="true"
      [provinciaId]="form().controls['idProvincia'].value"
      [localidadId]="form().controls['idsCiudad'].value[0] ?? null"
      (provinciaChange)="seleccionarProvincia($event)"
      (localidadChange)="seleccionarCiudad($event)"
    />

    <div class="advanced__field">
      <label class="advanced__label" for="filtro-tipo-propiedad">
        <svg lucideHouse [size]="25" aria-hidden="true"></svg>
        Tipo de propiedad
      </label>
      <div class="advanced__select">
        <select
          id="filtro-tipo-propiedad"
          [value]="form().controls['idsTipoPropiedad'].value[0] ?? ''"
          (change)="seleccionarTipoPropiedad($any($event.target).value)"
        >
          <option value="">Todas</option>
          @for (tipo of tiposPropiedad(); track tipo.id) {
            <option [value]="tipo.id">{{ tipo.nombre }}</option>
          }
        </select>
        <svg lucideChevronDown [size]="22" aria-hidden="true"></svg>
      </div>
    </div>

    <fieldset class="advanced__field advanced__price">
      <legend class="advanced__label">
        <svg lucideCoins [size]="25" aria-hidden="true"></svg>
        Precio mensual
      </legend>
      <div class="advanced__price-inputs">
        <div class="advanced__input">
          <input
            type="number"
            min="0"
            placeholder="Desde"
            aria-label="Precio mensual desde"
            formControlName="precioMin"
          />
          <span aria-hidden="true">$</span>
        </div>
        <span class="advanced__separator" aria-hidden="true">–</span>
        <div class="advanced__input">
          <input
            type="number"
            min="0"
            placeholder="Hasta"
            aria-label="Precio mensual hasta"
            formControlName="precioMax"
          />
          <span aria-hidden="true">$</span>
        </div>
      </div>
    </fieldset>

    <div class="advanced__field">
      <label class="advanced__label" for="filtro-ambientes">
        <svg lucideDoorOpen [size]="25" aria-hidden="true"></svg>
        Ambientes
      </label>
      <div class="advanced__select">
        <select
          id="filtro-ambientes"
          [value]="form().controls['ambientesSeleccionados'].value[0] ?? ''"
          (change)="seleccionarAmbientes($any($event.target).value)"
        >
          <option value="">Todos</option>
          @for (ambiente of ambientes; track ambiente) {
            <option [value]="ambiente">{{ ambiente === '4+' ? '4 o más' : ambiente }}</option>
          }
        </select>
        <svg lucideChevronDown [size]="22" aria-hidden="true"></svg>
      </div>
    </div>

    <div class="advanced__field">
      <label class="advanced__label" for="filtro-superficie">
        <svg lucideArrowLeftRight [size]="25" aria-hidden="true"></svg>
        m² mínimos
      </label>
      <div class="advanced__input">
        <input
          id="filtro-superficie"
          type="number"
          min="0"
          placeholder="Ej. 50"
          formControlName="superficieMin"
        />
        <span aria-hidden="true">m²</span>
      </div>
    </div>
  </div>
</section>
