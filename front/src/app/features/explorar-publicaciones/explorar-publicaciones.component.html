<main class="explore">
  <section class="explore-head">
    <a routerLink="/" class="explore-head__back">← <span>Volver al inicio</span></a>
    <div class="explore-head__content">
      <div>
        <p>Catálogo de alquileres</p>
        <h1>{{ titulo() }}</h1>
        <span>Encontrá tu próximo hogar entre las mejores propiedades disponibles.</span>
      </div>
      <div class="modalidades" aria-label="Tipo de alquiler">
        <button type="button" class="modalidad-btn modalidad-btn--primary" [class.modalidad-btn--active]="categoria() === 'largo-plazo'" (click)="seleccionarCategoria('largo-plazo')">Largo plazo</button>
        <button type="button" class="modalidad-btn modalidad-btn--secondary" [class.modalidad-btn--active]="categoria() === 'temporales'" (click)="seleccionarCategoria('temporales')">Temporales</button>
      </div>
    </div>
  </section>

  <form class="catalog-search" (ngSubmit)="buscarTexto()" role="search">
    <label for="catalog-search">Buscar publicaciones</label>
    <div class="catalog-search__field">
      <input
        id="catalog-search"
        type="search"
        [formControl]="busqueda"
        placeholder="Título, descripción, ciudad, provincia, modalidad..."
        autocomplete="off"
      />
      <button type="submit">
        <svg lucideSearch [size]="19" aria-hidden="true"></svg>
        <span>Buscar</span>
      </button>
    </div>
  </form>

  <app-advanced-filters [form]="form" [tiposPropiedad]="tiposPropiedad()" [ciudades]="ciudades()" [monedas]="monedas()" [modalidades]="modalidades()" (search)="buscar()" />
  <app-listing-grid [total]="resultado().total" [listings]="resultado().datos" [loading]="cargando()" [error]="error()" />
  @if (!cargando() && !error() && resultado().totalPaginas > 1) {
    <nav class="pagination" aria-label="Paginación de publicaciones">
      <button type="button" (click)="irAPagina(resultado().pagina - 1)" [disabled]="resultado().pagina === 1">Anterior</button>
      <span>Página {{ resultado().pagina }} de {{ resultado().totalPaginas }}</span>
      <button type="button" (click)="irAPagina(resultado().pagina + 1)" [disabled]="resultado().pagina === resultado().totalPaginas">Siguiente</button>
    </nav>
  }
</main>
